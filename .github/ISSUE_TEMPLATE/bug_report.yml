name: Bug report
description: Something didn't work — detection failed, colours are wrong, a crash.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The console output (or a screenshot) makes this
        much faster to fix. Please do not paste private screenshots.
  - type: input
    id: version
    attributes:
      label: Pyaint version
      description: Release tag or commit. Found in the window title / `git log -1 --oneline`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target app
      options:
        - skribbl.io
        - MS Paint
        - GIMP
        - Clip Studio Paint
        - Krita
        - Photoshop
        - Other / generic
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Release .exe
        - pip / pipx
        - From source (git clone)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Target: skribbl
        2. Click Auto-detect
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output / error
      description: Paste the relevant lines. Set `PYAINT_LOG_LEVEL=info` to quieten it.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here (annotated detection previews are very useful).
    validations:
      required: false
